<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eseménynaptár</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .container {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
            max-width: 500px;
            width: 90%;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            border-bottom: 3px solid #3498db;
            padding-bottom: 15px;
            margin-top: 0;
            margin-bottom: 30px;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .event-card {
            background: #fdfdfd;
            border: 1px solid #e1e8ed;
            border-left: 5px solid #3498db;
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 20px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .event-card:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
        }

        .event-card:last-child {
            margin-bottom: 0;
            border-left-color: #f39c12; /* A VB kártyája sárgás/narancsos jelzést kap */
        }

        .event-title {
            font-size: 18px;
            font-weight: 600;
            margin: 0 0 10px 0;
            color: #2980b9;
        }

        .event-card:last-child .event-title {
            color: #d68910;
        }

        .event-status {
            font-size: 15px;
            color: #e74c3c;
            font-style: italic;
            margin: 0;
            display: flex;
            align-items: center;
        }

        .event-status::before {
            content: '⏳';
            margin-right: 10px;
            font-style: normal;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Csapat Események</h1>

        <div class="event-card">
            <h2 class="event-title">Edzőmeccsek időpontjai</h2>
            <p class="event-status">Átmenetileg nem elérhető</p>
        </div>

        <div class="event-card">
            <h2 class="event-title">Edzések időpontjai</h2>
            <p class="event-status">Átmenetileg nem elérhető</p>
        </div>

        <div class="event-card">
            <h2 class="event-title">Világbajnokság időpontja</h2>
            <p class="event-status">Még nincs fix</p>
        </div>
    </div>

</body>
</html>
